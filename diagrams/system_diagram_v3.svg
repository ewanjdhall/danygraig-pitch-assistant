<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>
<defs><marker id="h_impl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#33413a"/></marker><marker id="h_sim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c26a00"/></marker><marker id="h_plan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8a908c"/></marker><marker id="h_bound" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b4fbb"/></marker></defs>
<text x="40" y="44" font-size="26" font-weight="700" text-anchor="start" fill="#1d2a22">Danygraig pitch assistant: system diagram (v3, 28 October 2026)</text>
<text x="40" y="72" font-size="14.5" font-weight="400" text-anchor="start" fill="#5d6b62">Components, the information and control flows between them, and what is implemented, simulated or planned. All pitch, booking and guest-information data is made up.</text>
<rect x="1180" y="96" width="34" height="20" rx="5" fill="#f1f8f3" stroke="#2e7d4f" stroke-width="2.2"/>
<text x="1222" y="111" font-size="14" font-weight="400" text-anchor="start" fill="#1d2a22">Implemented</text>
<rect x="1330" y="96" width="34" height="20" rx="5" fill="#fff5e6" stroke="#c26a00" stroke-width="2.2" stroke-dasharray="7 5"/>
<text x="1372" y="111" font-size="14" font-weight="400" text-anchor="start" fill="#1d2a22">Simulated</text>
<rect x="1480" y="96" width="34" height="20" rx="5" fill="#f5f6f5" stroke="#8a908c" stroke-width="2.2" stroke-dasharray="2 5"/>
<text x="1522" y="111" font-size="14" font-weight="400" text-anchor="start" fill="#1d2a22">Planned</text>
<rect x="1630" y="96" width="34" height="20" rx="5" fill="#e9f1fb" stroke="#1d4f8f" stroke-width="2.2"/>
<text x="1672" y="111" font-size="14" font-weight="400" text-anchor="start" fill="#1d2a22">Person</text>
<rect x="40" y="126" width="300" height="80" rx="10" fill="#e9f1fb" stroke="#1d4f8f" stroke-width="2.2"/>
<text x="54" y="150" font-size="17" font-weight="650" text-anchor="start" fill="#1d2a22">Guest</text>
<text x="54" y="172" font-size="14.5" font-weight="400" text-anchor="start" fill="#1d2a22">types a trip or a question; taps chips;</text>
<text x="54" y="193" font-size="14.5" font-weight="400" text-anchor="start" fill="#1d2a22">presses Hold, Confirm or Cancel</text>
<rect x="40" y="240" width="300" height="238" rx="10" fill="#f1f8f3" stroke="#2e7d4f" stroke-width="2.2"/>
<text x="54" y="264" font-size="17" font-weight="650" text-anchor="start" fill="#1d2a22">Chat page (index.html)</text>
<text x="54" y="286" font-size="14.5" font-weight="400" text-anchor="start" fill="#1d2a22">chips: stated · assumed · ? unclear</text>
<text x="54" y="307" font-size="14.5" font-weight="400" text-anchor="start" fill="#1d2a22">clarifying questions + quick replies</text>
<text x="54" y="328" font-size="14.5" font-weight="400" text-anchor="start" fill="#1d2a22">pitch card with its reasons</text>
<text x="54" y="349" font-size="14.5" font-weight="400" text-anchor="start" fill="#1d2a22">answer + where it comes from:</text>
<text x="54" y="370" font-size="14.5" font-weight="400" text-anchor="start" fill="#1d2a22">  passage, source, date, score</text>
<text x="54" y="391" font-size="14.5" font-weight="400" text-anchor="start" fill="#1d2a22">stale warning or “ask reception”</text>
<text x="54" y="412" font-size="14.5" font-weight="400" text-anchor="start" fill="#1d2a22">hold confirmation with arguments</text>
<text x="54" y="433" font-size="14.5" font-weight="400" text-anchor="start" fill="#1d2a22">Lab 4 checks (images, invalid hold)</text>
<text x="54" y="454" font-size="14.5" font-weight="400" text-anchor="start" fill="#1d2a22">“What the system did” (trace)</text>
<path d="M 190 206 L 190 240" fill="none" stroke="#33413a" stroke-width="2.0" marker-end="url(#h_impl)" marker-start="url(#h_impl)"/>
<rect x="420" y="210" width="660" height="660" rx="14" fill="#fbfcfb" stroke="#2e7d4f" stroke-width="1.6"/>
<text x="440" y="236" font-size="14.5" font-weight="650" text-anchor="start" fill="#2e5d43">app.py · turn(message, state, action)  (Python standard library, localhost:8000)</text>
<rect x="480" y="252" width="575" height="60" rx="10" fill="#f1f8f3" stroke="#2e7d4f" stroke-width="2.2"/>
<text x="494" y="276" font-size="17" font-weight="650" text-anchor="start" fill="#1d2a22">Context assembly + log_context(parts)</text>
<text x="494" y="298" font-size="14.5" font-weight="400" text-anchor="start" fill="#1d2a22">instructions + requirements so far + the message</text>
<rect x="859" y="241" width="184" height="22" rx="11" fill="#e6e8e6"/>
<text x="951.0" y="256.5" font-size="12" font-weight="650" text-anchor="middle" fill="#4b524e">planned: today's date</text>
<rect x="480" y="332" width="575" height="78" rx="10" fill="#fff5e6" stroke="#c26a00" stroke-width="2.2" stroke-dasharray="7 5"/>
<text x="494" y="356" font-size="17" font-weight="650" text-anchor="start" fill="#1d2a22">Extraction step · model.call_json(parts, schema v3)</text>
<text x="494" y="378" font-size="14.5" font-weight="400" text-anchor="start" fill="#1d2a22">each field: value + source + the guest's words,</text>
<text x="494" y="399" font-size="14.5" font-weight="400" text-anchor="start" fill="#1d2a22">or the message is a question about the park</text>
<rect x="480" y="422" width="575" height="60" rx="10" fill="#f1f8f3" stroke="#2e7d4f" stroke-width="2.2"/>
<text x="494" y="446" font-size="17" font-weight="650" text-anchor="start" fill="#1d2a22">validate(): ask before guessing</text>
<text x="494" y="468" font-size="14.5" font-weight="400" text-anchor="start" fill="#1d2a22">dates · party · vehicle · names like “Bella” → at most 2 questions</text>
<rect x="480" y="502" width="575" height="60" rx="10" fill="#f1f8f3" stroke="#2e7d4f" stroke-width="2.2"/>
<text x="494" y="526" font-size="17" font-weight="650" text-anchor="start" fill="#1d2a22">Availability lookup and ranking</text>
<text x="494" y="548" font-size="14.5" font-weight="400" text-anchor="start" fill="#1d2a22">fits · free · not held by another guest · reasons for each pitch</text>
<rect x="480" y="582" width="575" height="60" rx="10" fill="#f1f8f3" stroke="#2e7d4f" stroke-width="2.2"/>
<text x="494" y="606" font-size="17" font-weight="650" text-anchor="start" fill="#1d2a22">Answer path · answer_turn()</text>
<text x="494" y="628" font-size="14.5" font-weight="400" text-anchor="start" fill="#1d2a22">top 3 passages · score ≥ 0.25 · prefer the current edition</text>
<rect x="480" y="662" width="575" height="60" rx="10" fill="#fff5e6" stroke="#c26a00" stroke-width="2.2" stroke-dasharray="7 5"/>
<text x="494" y="686" font-size="17" font-weight="650" text-anchor="start" fill="#1d2a22">Answer step · quotes the chosen passage</text>
<text x="494" y="708" font-size="14.5" font-weight="400" text-anchor="start" fill="#1d2a22">gets instructions + quoted passages + question; no booking details</text>
<rect x="480" y="778" width="575" height="74" rx="10" fill="#f1f8f3" stroke="#2e7d4f" stroke-width="2.2"/>
<text x="494" y="802" font-size="17" font-weight="650" text-anchor="start" fill="#1d2a22">Hold proposal, built by the app (never by the model)</text>
<text x="494" y="824" font-size="14.5" font-weight="400" text-anchor="start" fill="#1d2a22">from the chips and the pitch the guest chose; confirmation shows the</text>
<text x="494" y="845" font-size="14.5" font-weight="400" text-anchor="start" fill="#1d2a22">arguments and marks assumed values; report built from the tool's result</text>
