<text x="441" y="500" font-size="11.5" font-style="italic" fill="#33413a" text-anchor="middle" transform="rotate(-90 441 500)">a question → answer path</text>
<path d="M 767 642 L 767 662" fill="none" stroke="#33413a" stroke-width="2.0" marker-end="url(#h_impl)"/>
<path d="M 432 752 L 480 752" stroke="#6b4fbb" stroke-width="2.4" stroke-dasharray="9 6"/>
<path d="M 1010 752 L 1068 752" stroke="#6b4fbb" stroke-width="2.4" stroke-dasharray="9 6"/>
<rect x="480" y="741" width="150" height="22" rx="11" fill="#6b4fbb"/>
<text x="555.0" y="756.5" font-size="12" font-weight="650" text-anchor="middle" fill="#fff">autonomy boundary</text>
<text x="642" y="757" font-size="12.5" font-weight="600" text-anchor="start" fill="#6b4fbb">above: suggests · below: acts only after the guest confirms</text>
<path d="M 340 282 L 480 282" fill="none" stroke="#33413a" stroke-width="2.0" marker-end="url(#h_impl)"/>
<text x="347" y="262.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#33413a" font-style="italic">request</text>
<text x="347" y="300.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#33413a" font-style="italic">message,</text>
<text x="347" y="314.5" font-size="11.5" font-weight="400" text-anchor="start" fill="#33413a" font-style="italic">state, action</text>
<path d="M 420 455 L 340 455" fill="none" stroke="#33413a" stroke-width="2.0" marker-end="url(#h_impl)"/>
<text x="347" y="446.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#33413a" font-style="italic">response</text>
<text x="347" y="472.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#33413a" font-style="italic">render(data)</text>
<rect x="1160" y="330" width="360" height="80" rx="10" fill="#f5f6f5" stroke="#8a908c" stroke-width="2.2" stroke-dasharray="2 5"/>
<text x="1174" y="354" font-size="17" font-weight="650" text-anchor="start" fill="#4b524e">A real LLM (planned)</text>
<text x="1174" y="376" font-size="14.5" font-weight="400" text-anchor="start" fill="#5d6b62">same parts and schema; its key from an</text>
<text x="1174" y="397" font-size="14.5" font-weight="400" text-anchor="start" fill="#5d6b62">environment variable, never in the code</text>
<path d="M 1160 367 L 1055 367" fill="none" stroke="#8a908c" stroke-width="2.0" stroke-dasharray="3 5" marker-end="url(#h_plan)"/>
<path d="M 1160 490 L 1160 576 A 200.0 12 0 0 0 1560 576 L 1560 490" fill="#f1f8f3" stroke="#2e7d4f" stroke-width="2.2"/>
<ellipse cx="1360.0" cy="490" rx="200.0" ry="12" fill="#f1f8f3" stroke="#2e7d4f" stroke-width="2.2"/>
<text x="1360.0" y="518" font-size="16.5" font-weight="650" text-anchor="middle" fill="#1d2a22">data/ (made-up)</text>
<text x="1360.0" y="538" font-size="14.5" font-weight="400" text-anchor="middle" fill="#1d2a22">pitches.json (14) · bookings.json (7)</text>
<text x="1360.0" y="558" font-size="14.5" font-weight="400" text-anchor="middle" fill="#1d2a22">holds.json: active holds</text>
<path d="M 1160 532 L 1055 532" fill="none" stroke="#33413a" stroke-width="2.0" marker-end="url(#h_impl)"/>
<text x="1068" y="524.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#33413a" font-style="italic">reads</text>
<path d="M 1160 616 L 1160 704 A 165.0 12 0 0 0 1490 704 L 1490 616" fill="#f1f8f3" stroke="#2e7d4f" stroke-width="2.2"/>
<ellipse cx="1325.0" cy="616" rx="165.0" ry="12" fill="#f1f8f3" stroke="#2e7d4f" stroke-width="2.2"/>
<text x="1325.0" y="644" font-size="16.5" font-weight="650" text-anchor="middle" fill="#1d2a22">corpus/: guest information</text>
<text x="1325.0" y="664" font-size="14.5" font-weight="400" text-anchor="middle" fill="#1d2a22">7 made-up documents, 1 superseded</text>
<text x="1325.0" y="684" font-size="14.5" font-weight="400" text-anchor="middle" fill="#1d2a22">retrieve.py: word overlap, top 3</text>
<rect x="1210" y="691" width="230" height="22" rx="11" fill="#e6e8e6"/>
<text x="1325.0" y="706.5" font-size="12" font-weight="650" text-anchor="middle" fill="#4b524e">planned: match meaning, not words</text>
<path d="M 1055 625 L 1160 625" fill="none" stroke="#33413a" stroke-width="2.0" marker-end="url(#h_impl)" marker-start="url(#h_impl)"/>
<text x="1066" y="614.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#33413a" font-style="italic">question</text>
<text x="1066" y="642.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#33413a" font-style="italic">passages +</text>
<text x="1066" y="656.5" font-size="11.5" font-weight="400" text-anchor="start" fill="#33413a" font-style="italic">source, date,</text>
<text x="1066" y="671.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#33413a" font-style="italic">score</text>
<rect x="1160" y="778" width="360" height="74" rx="10" fill="#f1f8f3" stroke="#2e7d4f" stroke-width="2.2"/>
<text x="1174" y="802" font-size="17" font-weight="650" text-anchor="start" fill="#1d2a22">hold_tool.py · hold_pitch</text>
<text x="1174" y="824" font-size="14.5" font-weight="400" text-anchor="start" fill="#1d2a22">checks: shape · permission · precondition</text>
<text x="1174" y="845" font-size="14.5" font-weight="400" text-anchor="start" fill="#1d2a22">confirmation · idempotency · logged</text>
<path d="M 1055 800 L 1160 800" fill="none" stroke="#33413a" stroke-width="2.0" marker-end="url(#h_impl)"/>
<text x="1064" y="792.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#33413a" font-style="italic">after Confirm</text>
<path d="M 1160 836 L 1055 836" fill="none" stroke="#33413a" stroke-width="2.0" marker-end="url(#h_impl)"/>
<text x="1066" y="852.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#33413a" font-style="italic">result</text>
<path d="M 1510 778 L 1510 580" fill="none" stroke="#33413a" stroke-width="2.0" marker-end="url(#h_impl)"/>
<text x="1518" y="690.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#33413a" font-style="italic">writes</text>
<text x="1518" y="704.5" font-size="11.5" font-weight="400" text-anchor="start" fill="#33413a" font-style="italic">a hold</text>
<rect x="1160" y="890" width="360" height="46" rx="10" fill="#f1f8f3" stroke="#2e7d4f" stroke-width="2.2"/>
<text x="1174" y="914" font-size="14.5" font-weight="650" text-anchor="start" fill="#1d2a22">tool_log.jsonl: one line per call</text>
