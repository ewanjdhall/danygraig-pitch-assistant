<text x="1594" y="824" font-size="14.5" font-weight="400" text-anchor="start" fill="#5d6b62">email (planned)</text>
<path d="M 1520 815 L 1580 815" fill="none" stroke="#8a908c" stroke-width="2.0" stroke-dasharray="3 5" marker-end="url(#h_plan)"/>
<rect x="40" y="900" width="300" height="76" rx="10" fill="#fff5e6" stroke="#c26a00" stroke-width="2.2" stroke-dasharray="7 5"/>
<text x="54" y="924" font-size="17" font-weight="650" text-anchor="start" fill="#1d2a22">vlm.py: the lab's mock</text>
<text x="54" y="946" font-size="14.5" font-weight="400" text-anchor="start" fill="#1d2a22">2 sample images: claim + confidence,</text>
<text x="54" y="967" font-size="14.5" font-weight="400" text-anchor="start" fill="#1d2a22">or refusal + reason</text>
<path d="M 500 870 L 500 933 L 340 933" fill="none" stroke="#33413a" stroke-width="2.0" marker-end="url(#h_impl)"/>
<text x="350" y="924.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#33413a" font-style="italic">image check</text>
<rect x="40" y="1004" width="300" height="82" rx="10" fill="#f5f6f5" stroke="#8a908c" stroke-width="2.2" stroke-dasharray="2 5"/>
<text x="54" y="1028" font-size="17" font-weight="650" text-anchor="start" fill="#4b524e">Photo of a van's plate (planned)</text>
<text x="54" y="1050" font-size="14.5" font-weight="400" text-anchor="start" fill="#5d6b62">read its length, shown as an</text>
<text x="54" y="1071" font-size="14.5" font-weight="400" text-anchor="start" fill="#5d6b62">assumed value with its confidence</text>
<path d="M 190 1004 L 190 976" fill="none" stroke="#8a908c" stroke-width="2.0" stroke-dasharray="3 5" marker-end="url(#h_plan)"/>
<text x="420" y="1040" font-size="13" font-weight="600" text-anchor="start" fill="#6b4fbb">Passages are quoted as data, not instructions · only the guest's Confirm reaches the hold tool</text>
